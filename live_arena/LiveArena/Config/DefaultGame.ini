; Live Arena game settings. Saved as UTF-8 (the engine reads UTF-8 ini files, so Chinese values are fine).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Live Arena
Description=Turns a livestream into a concert hall with seats, a lottery and an on-stage guest.
ProjectVersion=0.1.0

; Project Settings > Game > Live Arena. Every value can be overridden on the command line, e.g.
;   LiveArena.exe -ArenaServer=wss://example.com/ws -ArenaRoom=amy -ArenaKey=secret -ArenaDemo=0
; Keep these in sync with the ULiveArenaSettings constructor (LiveArenaSettings.cpp).
[/Script/LiveArena.LiveArenaSettings]
ServerUrl=
RoomId=myroom
HostKey=change-me
JoinUrl=
YouTubeVideoId=
ScreenSource=Auto
CaptureDeviceName=OBS Virtual Camera
StreamUrl=
GuestCallUrl=
StreamerName=直播主
bDemoMode=True
MaxFigures=2500
ExposureBias=0.000000

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
; Development keeps Saved/Logs/LiveArena.log, handy when the server link misbehaves.
BuildConfiguration=PPBC_Development
FullRebuild=False
UsePakFile=True
bUseIoStore=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
; Maps: the engine Entry map (default) and the optional editor-made arena level.
; If /Game/Maps/Arena has not been created yet the cooker only logs a warning for it.
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+MapsToCook=(FilePath="/Game/Maps/Arena")
; Meshes / material are loaded by path at runtime (LoadObject), so nothing references them for the cooker.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
