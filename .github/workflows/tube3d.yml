name: 🎬 影片大堂 / Tube3D

on:
  schedule:
    # 每 30 分鐘 (:17 / :47) — 特登避開直播人潮嗰個 workflow (:07/:27/:47) 嘅整點。
    # quota 好平: chart=mostPopular 一個地區得 1 unit,
    #   3 個地區 × 48 次/日 ≈ 144 units (直播人潮嗰邊用緊 ~7,300, 加埋都夠)。
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tube3d
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/streamer-viewer-visualization-hmhkzf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 攞 YouTube 片單
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 想個大堂似返「你嘅首頁」: 加一個 repo variable YT_CHANNELS,
          # 填你跟開嘅頻道 (@handle 或者 UC… id, 逗號分隔), 例如:
          #   @mkbhd,@veritasium,UCxxxxxxxxxxxxxxxx
          YT_CHANNELS: ${{ vars.YT_CHANNELS }}
          YT_REGIONS: ${{ vars.YT_REGIONS || 'HK,US,JP' }}
          YT_LIMIT: "24"
        run: python3 -m tube3d.collect

      - name: Commit 片單
        run: |
          git config user.name "tube3d-bot"
          git config user.email "actions@github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "片單冇變, 唔使 commit"
          else
            git commit -m "chore(tube3d): 更新影片大堂片單 [skip ci]"
            git push
          fi
